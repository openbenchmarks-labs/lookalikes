slug: exa
name: Exa
base_url: https://api.exa.ai
requires_seed_domain: false
cost: { mode: per_call, usd: 0.005 }
auth:
  - { header: x-api-key, env: EXA_API_KEY }
request:
  method: POST
  path: /search
  body:
    query: $query                     # "Find companies similar to <seed> (<domain>), <identity>."
    category: company
    type: auto
    numResults: $num_results          # set by build_request hook (k * over_fetch, capped 100)
    contents:
      text:
        maxCharacters: 600
response:
  candidates_path: [results]
hooks:
  build_request: exa_company_query
  transform_candidates: exa_dedupe_by_domain   # page hits -> one company per domain, score sort
configs:
  - { name: seed_first, over_fetch: 1 }
