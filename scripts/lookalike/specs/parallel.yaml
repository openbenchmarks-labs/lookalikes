slug: parallel
name: Parallel
base_url: https://api.parallel.ai
requires_seed_domain: false
cost: { mode: none }
auth:
  - { header: x-api-key, env: PARALLEL_API_KEY }
request:
  method: POST
  path: /v1beta/findall/entity-search
  body:
    entity_type: companies
    objective: $query
    match_limit: $k_min5         # API floor is 5
response:
  candidates_path: [results, entities, data]
hooks:
  build_request: parallel_objective
  transform_candidates: parallel_clean_aggregators   # strip www., route aggregator hosts out of domain
configs:
  - { name: full, prompt_variant: full }
  - { name: no_return, prompt_variant: no_return }
  - { name: no_similarity_clause, prompt_variant: no_similarity_clause }
